services:
  # -----------------------------------------------------------
  # Backend API (Node.js + Express + TypeScript) - Dev Mode
  # Directly connects to Aiven Cloud PostgreSQL via .env
  # -----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: smart_herbal_clinic_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: development
    volumes:
      # Mount host directory for live hot-reload
      - .:/app
      # Keep container node_modules isolated from host
      - /app/node_modules
      # Persistent upload directory
      - backend_uploads:/app/uploads

volumes:
  backend_uploads:
    driver: local
