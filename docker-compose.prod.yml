services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: smart_herbal_clinic_backend_prod
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
    volumes:
      - backend_uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  backend_uploads:
    driver: local
